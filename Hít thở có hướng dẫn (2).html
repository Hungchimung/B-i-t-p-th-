.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);pointer-events:none}
.top{text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.phase{font-size:1.7rem;font-weight:600}
.count{font-size:3rem;font-weight:300;line-height:1.1;font-variant-numeric:tabular-nums;min-height:1.1em}
.panel{pointer-events:auto;width:100%;max-width:460px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.desc{margin:0;color:var(--soft);font-size:.85rem;line-height:1.4;text-align:center}
.sel{display:flex;flex-direction:column;gap:10px}
.sel[hidden]{display:none}
.seg{display:flex;gap:5px;background:rgba(255,255,255,.07);border-radius:999px;padding:4px}
.seg.wrap{flex-wrap:wrap;border-radius:18px}.seg.wrap button{flex:1 1 30%}.seg button{flex:1;border:0;background:transparent;color:var(--soft);font:inherit;font-size:.8rem;padding:9px 4px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--btn-ink);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--soft);font-variant-numeric:tabular-nums}
.ctrl{display:flex;gap:10px}
.ctrl button{flex:1;font:inherit;font-weight:600;font-size:1rem;padding:13px;border-radius:14px;border:1px solid var(--accent);cursor:pointer;background:var(--accent);color:var(--btn-ink)}
.ctrl button.ghost{background:transparent;color:var(--accent)}
.ctrl button[hidden]{display:none}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.done{display:none;text-align:center;font-size:.9rem;line-height:1.45}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="c"></canvas>
<div class="ui">
  <div class="top" aria-live="polite"><div class="phase" id="phase">Sẵn sàng</div><div class="count" id="count"></div></div>
  <div class="panel">
    <p class="desc" id="desc"></p>
    <div class="sel" id="sel"><div class="seg wrap" id="modes"></div><div class="seg" id="cycles"></div><div class="seg" id="snd"></div></div>
    <div class="done" id="done"></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="meta"><span id="cyc"></span><span id="time"></span></div>
    <div class="ctrl">
      <button id="start">Bắt đầu</button>
      <button id="pause" class="ghost" hidden>Tạm dừng</button>
      <button id="stop" class="ghost" hidden>Kết thúc</button>
    </div>
  </div>
</div>

function initGL(){

function targets(){

}

    }
  }
  if (st === "running"){const key = pi + ":" + cyc; if (key !== lastKey){lastKey = key; phaseStart();}}
  const [tw, tv] = targets(), k = 1 - Math.exp(-dt*8);
  if (st !== "paused") W += (tw - W)*k;
  V += (tv - V)*k; PH += V*2.4*dt;
  draw(); render();
  requestAnimationFrame(tick);
}
const fmt = s => Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0");
function draw(){
  if (st === "countdown"){$("phase").textContent = "Chuẩn bị"; $("count").textContent = Math.ceil(cd);}
  else if (st === "running" || st === "paused"){
    const P = MODES[mode].ph[pi];
    $("phase").textContent = st === "paused" ? "Tạm dừng" : P[0];
    $("count").textContent = Math.max(1, Math.ceil(P[1] - t));
  }
  $("bar").style.width = Math.min(elapsed/dur*100, 100) + "%";
  if (st !== "done"){
    $("cyc").textContent = "Chu kỳ " + (st === "idle" ? 0 : cyc);
    $("time").textContent = fmt(elapsed) + " / " + fmt(dur);
  }
}

/* ---------- Âm thanh giọt nước ---------- */
let sound = 1, lastKey = "", AC = null, fade = null;
function audioInit(){
  if (!AC){const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C();}
  if (AC && AC.state === "suspended") AC.resume();
}
function silence(){
  if (!AC) return;
  if (AC.state === "suspended") AC.resume();
  if (fade){fade.gain.cancelScheduledValues(AC.currentTime); fade.gain.setTargetAtTime(0, AC.currentTime, .1); fade = null;}
}
function drop(len){
  if (!AC || !sound) return;
  const now = AC.currentTime + .02, T = Math.max(len, 2) + 1;
  const master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination); fade = master;
  const n = Math.floor(AC.sampleRate*T), ir = AC.createBuffer(2, n, AC.sampleRate);
  for (let c = 0; c < 2; c++){const d = ir.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/n, 2.2);}
  const conv = AC.createConvolver(); conv.buffer = ir;
  const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3500;
  const wet = AC.createGain(); wet.gain.value = 1.6;
  conv.connect(lp); lp.connect(wet); wet.connect(master);
  function plink(time, f, vol, pan){
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = "sine";                               // bong bóng khí: cao độ vút lên rất nhanh rồi tắt
    o.frequency.setValueAtTime(f, time);
    o.frequency.exponentialRampToValueAtTime(f*1.7, time + .05);
    o.frequency.exponentialRampToValueAtTime(f*2.1, time + .16);
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(vol, time + .003);
    g.gain.exponentialRampToValueAtTime(vol*.3, time + .04);
    g.gain.exponentialRampToValueAtTime(.0005, time + .22);
    const nb = AC.createBuffer(1, Math.floor(AC.sampleRate*.03), AC.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = (Math.random()*2-1)*Math.pow(1 - i/nd.length, 4);
    const ns = AC.createBufferSource(); ns.buffer = nb;   // tiếng chạm mặt nước
    const bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f*2.5; bp.Q.value = .8;
    const ng = AC.createGain(); ng.gain.value = vol*.6;
    const bus = AC.createGain();
    o.connect(g); g.connect(bus); ns.connect(bp); bp.connect(ng); ng.connect(bus);
    let out = bus;
    if (AC.createStereoPanner){const pn = AC.createStereoPanner(); pn.pan.value = pan; bus.connect(pn); out = pn;}
    out.connect(master); out.connect(conv);
    o.start(time); o.stop(time + .25); ns.start(time);
  }
  plink(now, 850, .8, 0);
  master.gain.setValueAtTime(.9, now + len*.6);  // tiếng vọng tắt hẳn khi hết nhịp thở ra
  master.gain.linearRampToValueAtTime(0, now + len + .3);
}
function phaseStart(){
  const P = MODES[mode].ph;
  if (P[pi][2] === "out") drop(P[pi][1]);   // giọt rơi ở cuối lúc dừng, vọng suốt nhịp thở ra
}

/* ---------- Giao diện ---------- */
function mk(box, items, cur, fn){
  box.innerHTML = "";
  items.forEach(([k, label]) => {
    const b = document.createElement("button");
    b.textContent = label; b.setAttribute("aria-pressed", k == cur);
    b.onclick = () => fn(k); box.appendChild(b);
  });
}
function ui(){
  const run = st === "countdown" || st === "running" || st === "paused";
  $("start").hidden = run; $("pause").hidden = !run; $("stop").hidden = !run;
  $("pause").textContent = st === "paused" ? "Tiếp tục" : "Tạm dừng";
  $("sel").hidden = run; $("desc").hidden = run; $("desc").textContent = MODES[mode].desc;
  mk($("modes"), Object.entries(MODES).map(([k,v]) => [k, v.name]), mode, k => {mode = k; reset();});
  mk($("cycles"), [5,10,15].map(n => [n*60, n + " phút"]), dur, n => {dur = n; reset();});
  mk($("snd"), [[1,"Có tiếng giọt nước"],[0,"Tắt âm"]], sound, k => {sound = +k; ui();});
}
function reset(){
  st = "idle"; pi = 0; t = 0; cyc = 1; elapsed = 0;
  $("phase").textContent = "Sẵn sàng"; $("count").textContent = "";
  $("done").style.display = "none"; ui();
}
$("start").onclick = () => {
  audioInit(); lastKey = "";
  $("done").style.display = "none";
  st = "countdown"; cd = 3; pi = 0; t = 0; cyc = 1; elapsed = 0; ui();
};
$("pause").onclick = () => {if (st === "paused") st = "running"; else if (st === "running") st = "paused"; if (AC) st === "paused" ? AC.suspend() : AC.resume(); ui();};
$("stop").onclick = () => finish(false);
function finish(complete){
  silence();
  const done = Math.max(cyc-1, 0), secs = Math.round(elapsed);
  st = "done"; ui();
  $("phase").textContent = complete ? "Hoàn thành" : "Đã kết thúc"; $("count").textContent = "";
  $("cyc").textContent = done + " chu kỳ"; $("time").textContent = fmt(secs) + " / " + fmt(dur);
  const d = $("done"); d.style.display = "block";
  d.innerHTML = complete
    ? "<b>Bạn đã hoàn thành phiên " + dur/60 + " phút</b> (" + done + " chu kỳ).<br>Thả lỏng vai và thở tự nhiên vài nhịp."
    : "Bạn dừng sau <b>" + done + " chu kỳ hoàn chỉnh</b> (" + fmt(secs) + "). Có thể bắt đầu lại bất cứ lúc nào.";
}
reset(); last = performance.now(); requestAnimationFrame(tick);
</script>
